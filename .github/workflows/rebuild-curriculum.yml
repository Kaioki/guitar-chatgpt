name: Rebuild guitar curriculum
on:
  push:
    branches: [main]
    paths:
      - "scripts/tune-curriculum.mjs"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transform-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: node scripts/tune-curriculum.mjs
      - run: npm test
      - run: npm run build
      - name: Commit curriculum and production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md tests docs
          git diff --cached --quiet || git commit -m "Refine acoustic curriculum and repertoire order"
          git push
